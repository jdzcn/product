<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>青花釉下彩 · 器物图录</title>
<meta name="description" content="青花釉下彩手作瓷器图录：茶具、茶壶、茶杯、花瓶、茶叶罐、文房与陈设，按器型、工艺与纹样题材检索。">
<meta name="theme-color" content="#16324f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316324f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23f6f2ea' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="hero">
  <div class="wrap hero-inner">
    <p class="eyebrow">釉下彩 · 青花 · 手作</p>
    <h1>青花釉下彩<span>器物图录</span></h1>
    <p class="lede">收录茶具、茶壶、茶杯、花瓶、酒具、茶叶罐、盖碗与文房器物，可按器型、工艺与纹样题材检索。</p>
    <p class="hero-stats" id="hero-stats" aria-live="polite"></p>
  </div>
</header>

<div class="toolbar">
  <div class="wrap toolbar-inner">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
      </svg>
      <input id="q" type="search" placeholder="搜索器型、题材、工艺、规格…" autocomplete="off" spellcheck="false">
      <button id="clear" type="button" aria-label="清除搜索" hidden>×</button>
    </label>
    <div class="sort-wrap">
      <label for="sort">排序</label>
      <select id="sort">
        <option value="default">默认</option>
        <option value="price-asc">价格从低到高</option>
        <option value="price-desc">价格从高到低</option>
        <option value="name">按名称</option>
      </select>
    </div>
  </div>
</div>

<main class="wrap">
  <section class="filters" id="filters" aria-label="按分类筛选"></section>
  <p class="result-line" id="result-line"></p>

  <section class="grid" id="grid" aria-live="polite" aria-busy="true"></section>
  <p class="empty" id="empty" hidden>没有找到匹配的作品，<button type="button" id="reset">清除全部筛选</button>。</p>

  <section class="notes" id="notes">
    <div class="section-head">
      <h2>工艺与纹样</h2>
      <p>每一件器物的绘制工艺与纹样寓意。</p>
    </div>
    <div class="note-grid" id="craft-notes"></div>
    <div class="theme-notes" id="theme-notes"></div>
  </section>
</main>

<footer>
  <div class="wrap footer-inner">
    <span id="footer-meta">静态导出的器物图录</span>
    <span>数据来自 product.db · 图片来自 images/ · 无后端</span>
  </div>
</footer>

<dialog class="detail" id="detail" aria-labelledby="detail-title">
  <button class="detail-close" type="button" aria-label="关闭">×</button>
  <div class="detail-panel">
    <div class="detail-media"><img id="detail-img" alt=""></div>
    <div class="detail-info">
      <p class="detail-kicker" id="detail-kicker"></p>
      <h2 id="detail-title"></h2>
      <p class="detail-price" id="detail-price"></p>
      <dl class="specs" id="detail-specs"></dl>
      <div id="detail-notes"></div>
    </div>
  </div>
</dialog>

<noscript>
  <p class="wrap noscript">本页需要启用 JavaScript 才能显示图录。</p>
</noscript>

<script src="assets/app.js" defer></script>
</body>
</html>
